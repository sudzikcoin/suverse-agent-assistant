<!doctype html><html><head><title>Get a free quote — Brightpath Movers</title></head><body>
<h1>Request a free moving quote</h1>
<form action="/get-a-quote" method="post" class="quote-form">
<label for="n">Name</label><input id="n" name="your-name" type="text" required>
<label for="p">Phone</label><input id="p" name="your-phone" type="tel" required>
<label for="e">Email</label><input id="e" name="your-email" type="email">
<label for="d">Move date</label><input id="d" name="move-date" type="date">
<label for="b">Number of bedrooms</label><input id="b" name="bedrooms" type="number">
<label for="f">Moving from</label><input id="f" name="from-address" type="text">
<label for="t">Moving to</label><input id="t" name="to-address" type="text">
<button type="submit">Get my free quote</button>
</form>
</body></html>
